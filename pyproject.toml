[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-diagnostics"
version = "3.1.0"
description = "Leakage-aware diagnostics for an existing Home Credit customer-level feature matrix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pyarrow>=14,<25",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
training = [
  "lightgbm>=4.6,<5",
  "xgboost>=3,<4",
]

[project.scripts]
home-credit-diagnostics = "home_credit_diagnostics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
